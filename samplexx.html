<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サンプルページ</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      font-family: sans-serif;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 32px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #1d9bf0;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0f7acb;
    }
  </style>

  <script>
    function openXPost() {
      const text = encodeURIComponent("サンプル投稿です！");
      const url = "https://x.com/intent/post?text=" + text;
      window.open(url, "_blank");
    }
  </script>
</head>
<body>
  <h1>サンプルページ</h1>
  <button onclick="openXPost()">サンプルボタン</button>
</body>
</html>
